<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pirate Islands Online</title>
<style>
  body { font: 17px/1.4 system-ui, sans-serif; max-width: 560px; margin: 0 auto; padding: 16px; background: #f4efe3; color: #222; }
  h1 { margin: 0 0 12px; } h2 { margin: 16px 0 8px; }
  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  /* 5 islands and 5 hauls fit one row on a 360px phone */
  .card { flex: 1; min-width: 56px; box-sizing: border-box; background: #fff; border: 2px solid #c9b78f; border-radius: 10px; padding: 6px 2px; text-align: center; font-size: 15px; overflow-wrap: anywhere; }
  .card b { display: block; font-size: 26px; } .card .muted { font-size: 13px; }
  .card.you { border-color: #1d5c7a; box-shadow: 0 0 0 2px #1d5c7a; }
  .t { display: inline-block; min-width: 1.4em; margin: 2px; padding: 0 4px; border: 1px solid #0005; border-radius: 9px; font-weight: bold; font-size: 15px; }
  button { font: inherit; padding: 10px 16px; border: 0; border-radius: 8px; background: #1d5c7a; color: #fff; cursor: pointer; margin: 4px 0; }
  button:disabled { opacity: 0.4; cursor: default; }
  button.big { width: 100%; font-size: 20px; padding: 16px; }
  button.card { color: #222; } button.sel { border-color: #1d5c7a; background: #d7ecf5; }
  .raid { color: #1a7f37; } .crash { color: #b42318; } .empty { color: #777; }
  .muted { color: #666; font-size: 15px; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; } td, th { border-bottom: 1px solid #ddd; padding: 4px; text-align: center; }
  input, select { font: inherit; padding: 8px; margin: 3px 0; box-sizing: border-box; } input { flex: 1; min-width: 0; }
  .code { font-size: 48px; font-weight: bold; letter-spacing: 0.15em; text-align: center; margin: 0; }
  .link { text-align: center; user-select: all; overflow-wrap: anywhere; margin-top: 0; }
  .qr svg { display: block; width: 160px; height: 160px; margin: 0 auto 8px; }
  .seat { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid #ddd; }
  .card.left { border-style: dashed; } /* a stand-in plays this seat */
  button.small { font-size: 15px; padding: 6px 10px; background: none; color: #1d5c7a; border: 1px solid #1d5c7a; }
  fieldset:disabled #app { opacity: 0.45; } /* lost the room: the last screen, greyed */
  /* The pick timer: a bar along the top edge, the seconds under it */
  #clock { position: fixed; top: 0; left: 0; right: 0; background: #f4efe3; }
  #bar { height: 20px; background: #1d5c7a; }
  #secs { max-width: 560px; margin: 0 auto; padding: 0 16px; font-size: 22px; line-height: 52px; color: #1d5c7a; }
  #secs b { font-size: 40px; }
  body.timed { padding-top: 88px; }
</style>
</head>
<body>
<div id="clock" hidden><div id="bar"></div><div id="secs"></div></div>
<h1>🏴‍☠️ Pirate Islands</h1>
<div id="note"></div>
<!-- The setup screen, at the bare address -->
<form id="setup" hidden onsubmit="event.preventDefault(); act.go()">
  <h2>Your name</h2>
  <input name="who" maxlength="20" placeholder="Your name" style="width: 100%">
  <p id="need" class="crash" hidden>Type your name first.</p>
  <button type="button" class="big" onclick="act.create()">Create a room</button>
  <h2>Join a room</h2>
  <div class="row"><input name="code" required minlength="5" maxlength="5" placeholder="5-letter code" autocapitalize="characters"
    autocomplete="off" oninput="this.value = this.value.toUpperCase()"><button>Join</button></div>
  <p><a href="/hotseat">Pass and play</a> <span class="muted">· one device, passed round the table</span></p>
</form>
<fieldset id="room" hidden>
  <p class="muted"><a href="/">← Other room</a></p>
  <!-- Outside #app so a redraw while typing keeps the name and the focus -->
  <form id="join" hidden onsubmit="event.preventDefault(); act.join(this.elements.who.value)">
    <h2 id="title"></h2>
    <div class="row"><input name="who" maxlength="20" placeholder="Your name"><button>Join</button></div>
  </form>
  <div id="app"><p class="muted">Finding the room…</p></div>
</fieldset>
<script src="rules.js"></script>
<script src="howtoplay.js"></script>
<script src="jettison-prototype.js"></script> <!-- PROTOTYPE (PI3 05) -->
<script src="qrcode.js"></script> <!-- qrcode-generator 2.0.4, MIT: qrcode-LICENSE.txt -->
<script>
// The online page: one tab, one seat. The game runs only in the room (online/src/room.js); this page
// draws the room's last message and sends join, seats, free, start, pick and new. From rules.js it
// reads only RULES and the bots' names.
const { RULES, BOTS } = Rules;
const LETTERS = 'ABCDE';
const esc = s => s.replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`); // everything in a message comes from the room or other tabs
const $ = id => document.getElementById(id);

let seat, waiting, V, error, host, timer, standIns = [], crashRule = 'jettison', note = null; // the room's last message, drawn as it is: the page keeps no game of its own
let sel = null, joined = false; // the island selected but not locked in; whether this tab sent join
// lost: when the connection dropped, null while connected. gone: 'no such room', 'room closed' or 'room expired', never retried.
// displaced: a newer connection took this tab's seat, so it forgot its token and only watches.
let lost = null, gone = null, displaced = false;

// The code lives in the URL, the name and the seat token in sessionStorage (per tab, so a refresh keeps
// the seat). localStorage only prefills the name field: it never takes a seat.
const code = (new URLSearchParams(location.search).get('room') ?? '').toUpperCase(); // the link is /?room=K7QXM
const recall = (store, key = 'name') => { try { return window[store].getItem(key); } catch { return null; } };
const keep = name => { try { sessionStorage.setItem('name', name); localStorage.setItem('name', name); } catch {} };
const keepToken = token => { try { token ? sessionStorage.setItem('token', token) : sessionStorage.removeItem('token'); } catch {} };
for (const form of [$('setup'), $('join')]) form.elements.who.value = recall('localStorage') ?? '';

// Reconnecting (PIO4 04): at once when the page becomes visible, else 1, 2, 4… s apart up to 10 s while
// visible, never giving up. A ping with no pong in 4 s means the socket is dead, as on a waking phone.
let ws, tries = 0, retry, watchdog, rejoining = false;
const send = msg => ws.send(JSON.stringify(msg));
function connect() {
  clearTimeout(retry); clearTimeout(watchdog); watchdog = null;
  if (ws) { ws.onclose = ws.onmessage = null; ws.close(); } // the old socket is dropped unheard, so it can't displace this one
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/room/${encodeURIComponent(code)}`);
  ws.onopen = () => { tries = 0; const saved = recall('sessionStorage'); if ((rejoining = saved !== null && !displaced)) act.join(saved); };
  ws.onmessage = e => {
    if (e.data === 'pong') { clearTimeout(watchdog); watchdog = null; return; }
    const m = JSON.parse(e.data);
    if (rejoining && !m.error) { rejoining = false; if (m.seat === null) return; } // the room's hello, sent before it reads our join
    lost = null;
    const revealing = V && !roundOpen(); // a reveal or game over on screen before this message
    if (['no such room', 'room closed', 'room expired'].includes(m.error)) gone = m.error, timer = null;
    else ({ seat, waiting, view: V, error, host, timer, standIns = [], crashRule = 'jettison', note = null } = m);
    if (error === 'your seat is on another tab or phone') displaced = true, error = null, keepToken(null);
    if (m.token) keepToken(m.token);
    if (!revealing && V && !roundOpen()) HowToPlay.revealed(); // turns an open How to play card's header red
    drawClock(); render(); keepAwake();
  };
  ws.onclose = lose;
}
function lose() {
  if (gone) return;
  lost ??= Date.now(); render(); setTimeout(render, 30000); // then the banner says it's still trying
  clearTimeout(retry);
  if (document.visibilityState === 'visible') retry = setTimeout(connect, Math.min(10000, 1000 * 2 ** tries++));
}
// A ping tells the room this phone is still here (a seat silent for 15 s is dropped), and its pong that the socket works.
function ping() {
  if (ws.readyState !== WebSocket.OPEN) return;
  ws.send('ping'); watchdog ??= setTimeout(() => { ws.onclose = null; ws.close(); lose(); }, 4000);
}
if (code) {
  connect();
  setInterval(() => document.visibilityState === 'visible' && ping(), 5000);
  document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && (lost ? connect() : ping(), keepAwake()));
  document.addEventListener('click', keepAwake); // an iPhone grants it only from a tap
}

// Wake Lock (PIO5 03): the screen stays on while this page is in a room, lobby or game, and lets go at game
// over and on leaving. Only over https (on the Wi-Fi's http address it doesn't exist); refusals are ignored
// and nothing is shown. The browser lets go whenever the page is hidden, so it is asked again on return.
let lock = null, asking = false;
function keepAwake() {
  if (!('wakeLock' in navigator)) return;
  if (gone || V?.over) { lock?.release().catch(() => {}); lock = null; return; }
  if (asking || (lock && !lock.released) || document.visibilityState !== 'visible') return;
  asking = true;
  navigator.wakeLock.request('screen').then(l => { lock = l; }, () => {}).finally(() => { asking = false; });
}

// The bar shrinks smoothly from the msLeft in the room's last message; the seconds count down from it.
// Only the pick timer is shown: the 5 s reveal pause has nothing on screen (PIO4 10).
let deadline;
const picking = () => timer?.kind === 'pick' || timer?.kind === 'jettison'; // PROTOTYPE: the jettison timer on the same bar
function drawClock() {
  $('clock').hidden = !picking(); document.body.classList.toggle('timed', picking());
  if (!picking()) return;
  const bar = $('bar'), full = (timer.kind === 'jettison' ? JP.JETTISON_TIMER : RULES.pickTimer) * 1000;
  deadline = Date.now() + timer.msLeft;
  bar.style.transition = 'none'; bar.style.width = `${Math.min(100, (100 * timer.msLeft) / full)}%`;
  bar.offsetWidth; // the shrink starts from this width
  bar.style.transition = `width ${timer.msLeft}ms linear`; bar.style.width = '0';
  tick();
}
// An open How to play card covers the bar, so its header repeats the seconds.
function tick() {
  if (!picking()) return HowToPlay.status('');
  const secs = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
  $('secs').innerHTML = `<b>${secs}</b>`; HowToPlay.status(`⏱ ${secs} s left to ${timer.kind}`);
}
setInterval(tick, 250);

// ---- Actions (called from buttons) ----
const named = () => { const name = $('setup').elements.who.value.trim(); $('need').hidden = !!name; return name; };
const act = {
  async create() {
    const name = named(); if (!name) return;
    try {
      const res = await fetch('/create', { method: 'POST', body: JSON.stringify({ name }) });
      if (res.status === 429) return ($('note').innerHTML = '<p class="crash">Too many new rooms from this connection. Try again in an hour, or join a room by its code.</p>');
      const { code, token } = await res.json();
      keep(name); keepToken(token); location.href = `/?room=${code}`; // one way into a room: the link, which joins seat 0 by its token
    } catch { $('note').innerHTML = `<p class="crash">Couldn't make a room. Check your connection.</p>`; }
  },
  go() { const name = named(); if (name) { keep(name); location.href = `/?room=${$('setup').elements.code.value}`; } },
  join(name) { keep(name); joined = true; $('join').hidden = true; send({ type: 'join', name, token: recall('sessionStorage', 'token') ?? undefined }); },
  seat(q, bot) { send({ type: 'seats', bots: waiting.map((s, i) => (i === q ? bot || null : s.bot)) }); },
  free(q) { send({ type: 'free', seat: q }); },
  resize(by) { const bots = waiting.map(s => s.bot); send({ type: 'seats', bots: by > 0 ? [...bots, null] : bots.slice(0, -1) }); },
  start() { send({ type: 'start' }); },
  choose(i) { sel = i; render(); },
  lock() { send({ type: 'pick', island: sel }); sel = null; },
  again() { send({ type: 'new' }); },
  rule(r) { send({ type: 'rule', rule: r }); }, // PROTOTYPE
  jlock() { send({ type: 'jettison', colour: JP.s.colour, island: JP.s.island }); JP.reset(); },
  end() { send({ type: 'end' }); },
  takeOver() { send(waiting ? { type: 'seats', bots: waiting.map(s => s.bot) } : { type: 'new' }); }, // refused while the host is connected
};

// ---- Views: drawn from the last message alone ----
const L = i => LETTERS[i];
const name = q => esc(V.players[q].name);
const names = who => who.map(name).join(' & ');
const you = q => (q === seat ? ' (you)' : '');
const bot = b => (b ? ` <span class="muted">🤖 ${esc(b)}</span>` : '');
const hostName = () => esc((waiting ? waiting[host].name : V.players[host].name) || 'the host');
const tokens = counts => counts.map((n, c) => n ? `<span class="t" style="background:${RULES.treasure[c].ink}">${RULES.treasure[c].mark}${n > 1 ? `×${n}` : ''}</span>` : '').join('') || '<span class="empty">empty</span>';
const letters = counts => counts.map((n, c) => RULES.treasure[c].mark.repeat(n)).join('') || '–';
const bestColour = p => { const n = Math.max(...p.haul), t = RULES.treasure[p.haul.indexOf(n)]; return `${n} ${n === 1 ? t.one : t.name}`; };
const roundOpen = () => !V.last || V.last.round !== V.round;
const takeOver = () => (seat === null ? '' : `<button class="small" onclick="act.takeOver()">${hostName()} gone? Take over as host</button>`);

// Before the game: every seat by name, a bot as "Player N 🤖 Greedy", or not yet joined. An away seat is kept for its person.
const away = s => (s.away ? ' <span class="muted">· away</span>' : '');
const seatList = () => `<div class="row">${waiting.map((s, q) => `<div class="card ${q === seat ? 'you' : ''}">${s.name === null
  ? '<span class="muted">not yet joined</span>' : esc(s.name || `Player ${q + 1}`) + you(q) + away(s)}${bot(s.bot)}</div>`).join('')}</div>`;
const kept = () => waiting.map((s, q) => (s.away ? `Seat ${q + 1} is kept for ${esc(s.name)}. ` : '')).join('');

// The code, big enough to read across a table, the full link to select, and the link as a QR code for a
// camera (made once: the link never changes).
const link = `${location.origin}/?room=${code}`;
let qrSvg;
const qr = () => { if (!qrSvg) { const q = qrcode(0, 'M'); q.addData(link); q.make(); qrSvg = q.createSvgTag({ cellSize: 4, margin: 16, scalable: true }); } return qrSvg; };
const roomCode = () => `<p class="muted" style="text-align: center; margin: 8px 0 0">Room</p><p class="code">${esc(code)}</p>
  <p class="muted link">${esc(link)}</p><div class="qr">${qr()}</div>`;

// The host's lobby: a dropdown for every seat no token holds, Free seat for an away one; every change sends at once.
const CHOICES = [['', 'Open for a person'], ...BOTS.personalities.map(p => [p.name, `🤖 ${p.name}`])];
const dropdown = (q, b) => `<select onchange="act.seat(${q}, this.value)">${CHOICES.map(([v, label]) =>
  `<option value="${v}" ${v === (b ?? '') ? 'selected' : ''}>${label}</option>`).join('')}</select>`;
const ended = () => (note === 'ended' ? '<p class="crash"><b>The last game ended early: unfinished, nobody won.</b></p>' : '');
const hostLobby = () => ended() + roomCode() + waiting.map((s, q) => `<div class="seat"><b>Seat ${q + 1}</b> ${q === host ? 'You (host)'
  : s.away ? `${esc(s.name)}${away(s)} <button class="small" onclick="act.free(${q})">Free seat</button>`
  : s.name !== null && !s.bot ? esc(s.name) : dropdown(q, s.bot) + (s.bot ? '' : ' <span class="muted">waiting…</span>')}</div>`).join('')
  + `<div class="row" style="justify-content: center; margin-top: 8px">
    <button onclick="act.resize(-1)" ${waiting.length <= RULES.minPlayers ? 'disabled' : ''}>−</button> ${waiting.length} seats
    <button onclick="act.resize(1)" ${waiting.length >= RULES.maxPlayers ? 'disabled' : ''}>+</button></div>
  ${JP.ruleSwitch(crashRule, true)}
  <button class="big" onclick="act.start()">Start</button>`;

// ticks: a ✓ beside each seat that has picked this round.
function board(ticks) {
  return `${JP.topTag(V.crashRule)}<div class="row">${V.islands.map((pile, i) => `<div class="card">Island ${L(i)}<br>${tokens(pile)}</div>`).join('')}</div>
    <div class="row">${V.players.map((p, q) => `<div class="card ${q === seat ? 'you' : ''} ${standIns[q] ? 'left' : ''}">${name(q)}${you(q)}${bot(p.bot)}${ticks && p.picked ? ' ✓' : ''}
      ${standIns[q] ? '<br><span class="muted">left · 🤖 playing</span>' : ''}<br>${tokens(p.haul)}</div>`).join('')}</div>
    <p class="muted">Round ${V.round} · first to ${RULES.winAt} of one colour wins${JP.roundExtra(V.crashRule)}</p>${seat === host ? JP.endButton('top') : ''}`;
}

function resultLine(r, i) {
  if (r.kind === 'raid') return `<p class="raid"><b>${L(i)}:</b> ${names(r.who)} raided it alone and took ${tokens(r.before)}! Now: ${tokens(r.after)}</p>`;
  if (r.kind === 'crash') return JP.crashLine(r, i, names(r.who), V.crashRule);
  return `<p class="empty"><b>${L(i)}:</b> Nobody came. Now: ${tokens(r.after)}</p>`;
}

const reveal = () => !V.last ? '' : `${V.last.picks[seat] === null ? '<p class="crash"><b>Time ran out: you were skipped this round.</b></p>' : ''}<h2>Reveal!</h2>
  <p>${V.last.picks.map((isl, q) => `<b>${name(q)}</b>${V.last.standIns?.[q] ? ' 🤖' : ''} → ${isl === null ? 'skipped (too slow)' : L(isl)}`).join(' · ')}</p>
  ${V.last.results.map(resultLine).join('')}
  ${JP.jettisonReveal(V.last, name)}
  ${V.bagOut ? `<p class="crash"><b>The bag can't refill every island: the game ends!</b></p>` : ''}`;

// While a round is open, V.last is the round before: one line per player, as its reveal said (PIO4 10).
const lastRound = () => V.last ? `<p class="muted">Last round</p>${V.last.picks.map((isl, q) => {
  const r = V.last.results[isl], line = `${name(q)}${you(q)}${V.last.standIns?.[q] ? ' 🤖' : ''} → ${!r ? 'skipped (too slow)'
    : `${L(isl)}: ${r.kind === 'raid' ? `raided alone, took ${tokens(r.before)}` : `💥 crash with ${names(r.who.filter(w => w !== q))}${JP.jSuffix(V.last, q)}`}`}`;
  return `<p class="${q === seat && !r ? 'crash' : ''}">${q === seat ? `<b>${line}</b>` : line}</p>`;
}).join('')}` : '';

const pickView = () => `<h2>Choose an island</h2>
  <div class="row">${V.islands.map((pile, i) => `<button class="card ${sel === i ? 'sel' : ''}" onclick="act.choose(${i})"><b>${L(i)}</b>${tokens(pile)}</button>`).join('')}</div>
  <button class="big" ${sel === null ? 'disabled' : ''} onclick="act.lock()">Lock in${sel === null ? '' : ` Island ${L(sel)}`}</button>`;

function end() {
  const all = V.history.flatMap(h => h.results);
  return `${V.unfinished ? '<h2>Game ended early</h2><p>Unfinished: nobody wins.</p>' : `<h2>🏆 ${V.winners.map(q => `${name(q)} (${bestColour(V.players[q])})`).join(' & ')} ${V.winners.length > 1 ? 'share the win' : 'wins'}!</h2>`}
  ${V.bagOut ? `<p>The bag ran out, so the most of one colour won.</p>` : ''}
  <p>Rounds: <b>${V.history.length}</b> · Raids: <b>${all.filter(r => r.kind === 'raid').length}</b> ·
     Crashes: <b>${all.filter(r => r.kind === 'crash').length}</b> · Biggest island: <b>${V.maxIsland}</b> tokens</p>
  <div class="scroll"><table><tr><th>Round</th>${V.players.map((_, q) => `<th>${name(q)}</th>`).join('')}<th>Islands after</th></tr>
  ${V.history.map(h => `<tr><td>${h.round}</td>${h.picks.map((isl, q) => {
    const r = h.results[isl];
    if (!r) return '<td class="empty">skipped</td>';
    return `<td class="${esc(r.kind)}">${L(isl)}${h.standIns?.[q] ? ' 🤖' : ''}${r.kind === 'raid' ? ` +${letters(r.before)}` : r.kind === 'crash' ? ` 💥${JP.jCell(h, q)}` : ''}</td>`;
  }).join('')}<td>${h.results.map((r, i) => `${L(i)}:${letters(r.after)}`).join(' ')}</td></tr>`).join('')}</table></div>
  ${seat === host ? `<button class="big" onclick="act.again()">${V.unfinished ? 'Back to the lobby' : 'New game'}</button>` : `<p class="muted">Waiting for ${hostName()} to start a new game</p>${takeOver()}`}`;
}

// PROTOTYPE: the jettison step. Crashers are the seats on a crashed island in V.last; jettisoning = still owes one.
function jettisonStep() {
  const h = V.last, crashers = h.picks.flatMap((isl, q) => (isl !== null && h.results[isl].kind === 'crash' && (V.players[q].jettisoning || V.players[q].haul.some(Boolean)) ? [q] : []));
  const endB = seat === host ? JP.endButton('bottom') : '';
  if (seat !== null && V.players[seat].jettisoning)
    return board() + reveal() + JP.jettisonView({ who: '', haul: V.players[seat].haul, islands: V.islands, crashedOn: h.picks[seat], lock: 'act.jlock()' }) + endB;
  return board() + reveal() + JP.waitingView({ list: crashers.map(q => ({ name: name(q) + you(q), done: !V.players[q].jettisoning })), mine: V.myJettison }) + endB;
}

// The screen follows from the message (PIO2 03's table and PIO3 03's lobbies in the vault).
function screen() {
  if (seat === null && !joined) return waiting ? seatList() : board(); // Join: the form above, the room underneath
  if (V?.over) return board() + reveal() + end(); // Game over, for a seat or a spectator
  if (seat === null) return `<h2>Watching</h2><p class="muted">${displaced ? 'Your seat is now on another tab or phone. This one is watching.'
    : waiting ? (kept() || 'Every seat is taken. ') + "You'll get a seat if one opens." : 'Every seat is taken.'}
    ${standIns.some(Boolean) ? 'A seat a bot is playing can only go back to the phone that left it.' : ''}</p>${waiting ? seatList() : board() + (V.last ? reveal() : '')}`;
  if (waiting) return seat === host ? hostLobby() : ended() + roomCode() + `<p>Waiting for ${hostName()} to start</p>${takeOver()}${seatList()}${JP.ruleSwitch(crashRule, false)}`;
  if (!roundOpen() && (V.players.some(p => p.jettisoning) || timer?.kind === 'jettison')) return jettisonStep(); // PROTOTYPE
  if (!roundOpen()) return board() + reveal() + (seat === host ? JP.endButton('bottom') : '');
  if (standIns[seat]) return board(true) + lastRound() + `<h2>Welcome back!</h2><p>A bot is playing your seat this round. You play again from the next round.</p>
    ${V.myPick === null ? '' : `<p>The bot picked ${L(V.myPick)} for you.</p>`}`; // returned mid-round: the stand-in has already picked
  const endB = seat === host ? JP.endButton('bottom') : '';
  if (V.myPick === null) return board() + lastRound() + pickView() + endB;
  return board(true) + lastRound() + `<h2>You picked ${L(V.myPick)}</h2><p class="muted">✓ = picked. Waiting for the others…</p>` + endB;
}

function render() {
  const setup = !code || gone; // a refused code or a closed room gets the setup screen back, the name filled in
  $('setup').hidden = !setup; $('room').hidden = setup;
  if (gone === 'no such room') $('setup').elements.code.value = code.slice(0, 5);
  const why = { 'room closed': `Room ${esc(code)} has closed: every player had left.`, 'room expired': `Room ${esc(code)} closed after 2 hours with no moves.` };
  $('note').innerHTML = gone ? `<p class="crash"><b>${why[gone] ?? `There's no room ${esc(code)}. Check the code.`}</b></p>`
    : (lost ? `<p class="muted"><b>Reconnecting…</b>${Date.now() - lost > 30000 ? ' Still trying. Check your connection.' : ''}</p>` : '') + (error ? `<p class="crash">${esc(error)}</p>` : '');
  if (setup) return;
  $('title').textContent = `Room ${code}`;
  $('room').disabled = !!lost;
  $('join').hidden = joined || seat !== null;
  if (seat !== undefined) $('app').innerHTML = screen();
}
HowToPlay.mount(true, !code); // opens itself once, on a first visit to setup
JP.redraw = render; JP.onEnd = act.end; JP.bar(); // PROTOTYPE
render();
</script>
</body>
</html>
