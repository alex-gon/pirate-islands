<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pirate Islands Online</title>
<style>
  body { font: 17px/1.4 system-ui, sans-serif; max-width: 560px; margin: 0 auto; padding: 16px; background: #f4efe3; color: #222; }
  h1 { margin: 0 0 12px; } h2 { margin: 16px 0 8px; }
  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  /* 5 islands and 5 hauls fit one row on a 360px phone */
  .card { flex: 1; min-width: 56px; box-sizing: border-box; background: #fff; border: 2px solid #c9b78f; border-radius: 10px; padding: 6px 2px; text-align: center; font-size: 15px; overflow-wrap: anywhere; }
  .card b { display: block; font-size: 26px; } .card .muted { font-size: 13px; }
  .card.you { border-color: #1d5c7a; box-shadow: 0 0 0 2px #1d5c7a; }
  .t { display: inline-block; min-width: 1.4em; margin: 2px; padding: 0 4px; border: 1px solid #0005; border-radius: 9px; font-weight: bold; font-size: 15px; }
  button { font: inherit; padding: 10px 16px; border: 0; border-radius: 8px; background: #1d5c7a; color: #fff; cursor: pointer; margin: 4px 0; }
  button:disabled { opacity: 0.4; cursor: default; }
  button.big { width: 100%; font-size: 20px; padding: 16px; }
  button.card { color: #222; } button.sel { border-color: #1d5c7a; background: #d7ecf5; }
  .raid { color: #1a7f37; } .crash { color: #b42318; } .empty { color: #777; }
  .muted { color: #666; font-size: 15px; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; } td, th { border-bottom: 1px solid #ddd; padding: 4px; text-align: center; }
  input, select { font: inherit; padding: 8px; margin: 3px 0; box-sizing: border-box; } input { flex: 1; min-width: 0; }
  .code { font-size: 48px; font-weight: bold; letter-spacing: 0.15em; text-align: center; margin: 0; }
  .link { text-align: center; user-select: all; overflow-wrap: anywhere; margin-top: 0; }
  .seat { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid #ddd; }
</style>
</head>
<body>
<h1>🏴‍☠️ Pirate Islands</h1>
<div id="note"></div>
<!-- The setup screen, at the bare address -->
<form id="setup" hidden onsubmit="event.preventDefault(); act.go()">
  <h2>Your name</h2>
  <input name="who" maxlength="20" placeholder="Your name" style="width: 100%">
  <p id="need" class="crash" hidden>Type your name first.</p>
  <button type="button" class="big" onclick="act.create()">Create a room</button>
  <h2>Join a room</h2>
  <div class="row"><input name="code" required minlength="5" maxlength="5" placeholder="5-letter code" autocapitalize="characters"
    autocomplete="off" oninput="this.value = this.value.toUpperCase()"><button>Join</button></div>
  <p><a href="/hotseat">Pass and play</a> <span class="muted">· one device, passed round the table</span></p>
</form>
<fieldset id="room" hidden>
  <p class="muted"><a href="/">← Other room</a></p>
  <!-- Outside #app so a redraw while typing keeps the name and the focus -->
  <form id="join" hidden onsubmit="event.preventDefault(); act.join(this.elements.who.value)">
    <h2 id="title"></h2>
    <div class="row"><input name="who" maxlength="20" placeholder="Your name"><button>Join</button></div>
  </form>
  <div id="app"><p class="muted">Finding the room…</p></div>
</fieldset>
<script src="rules.js"></script>
<script>
// The online page: one tab, one seat. The game runs only in the room (online/src/room.js); this page
// draws the room's last message and sends join, seats, start, pick, next and new. From rules.js it
// reads only RULES and the bots' names.
const { RULES, BOTS } = Rules;
const LETTERS = 'ABCDE';
const esc = s => s.replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`); // everything in a message comes from the room or other tabs
const $ = id => document.getElementById(id);

let seat, waiting, V, error; // the room's last message, drawn as it is: the page keeps no game of its own
let sel = null, joined = false, lost = false, noRoom = false; // the island selected but not locked in; whether this tab sent join; the room closed; the code names no room

// The code lives in the URL, the name in sessionStorage (per tab, so a refresh keeps the seat).
// localStorage only prefills the name field: it never takes a seat.
const code = (new URLSearchParams(location.search).get('room') ?? '').toUpperCase(); // the link is /?room=K7QXM
const recall = store => { try { return window[store].getItem('name'); } catch { return null; } };
const keep = name => { try { sessionStorage.setItem('name', name); localStorage.setItem('name', name); } catch {} };
for (const form of [$('setup'), $('join')]) form.elements.who.value = recall('localStorage') ?? '';

let ws, send;
if (code) {
  ws = new WebSocket(`ws://${location.host}/room/${encodeURIComponent(code)}`), send = msg => ws.send(JSON.stringify(msg));
  const saved = recall('sessionStorage');
  ws.onopen = () => { if (saved !== null) act.join(saved); };
  ws.onmessage = e => { const m = JSON.parse(e.data); noRoom = m.seat === undefined; ({ seat, waiting, view: V, error } = m); render(); };
  ws.onclose = () => { lost = true; render(); }; // no auto-reconnect: that's Project 4
}

// ---- Actions (called from buttons) ----
const named = () => { const name = $('setup').elements.who.value.trim(); $('need').hidden = !!name; return name; };
const act = {
  async create() {
    const name = named(); if (!name) return;
    try {
      const { code } = await (await fetch('/create', { method: 'POST', body: JSON.stringify({ name }) })).json();
      keep(name); location.href = `/?room=${code}`; // one way into a room: the link, which joins seat 0 by name
    } catch { $('note').innerHTML = `<p class="crash">Couldn't make a room. Is the Mac's server running?</p>`; }
  },
  go() { const name = named(); if (name) { keep(name); location.href = `/?room=${$('setup').elements.code.value}`; } },
  join(name) { keep(name); joined = true; $('join').hidden = true; send({ type: 'join', name }); },
  seat(q, bot) { send({ type: 'seats', bots: waiting.map((s, i) => (i === q ? bot || null : s.bot)) }); },
  resize(by) { const bots = waiting.map(s => s.bot); send({ type: 'seats', bots: by > 0 ? [...bots, null] : bots.slice(0, -1) }); },
  start() { send({ type: 'start' }); },
  choose(i) { sel = i; render(); },
  lock() { send({ type: 'pick', island: sel }); sel = null; },
  next() { send({ type: 'next' }); },
  again() { send({ type: 'new' }); },
};

// ---- Views: drawn from the last message alone ----
const L = i => LETTERS[i];
const name = q => esc(V.players[q].name);
const names = who => who.map(name).join(' & ');
const you = q => (q === seat ? ' (you)' : '');
const bot = b => (b ? ` <span class="muted">🤖 ${esc(b)}</span>` : '');
const host = () => esc((waiting ? waiting[0].name : V.players[0].name) || 'the host');
const tokens = counts => counts.map((n, c) => n ? `<span class="t" style="background:${RULES.treasure[c].ink}">${RULES.treasure[c].mark}${n > 1 ? `×${n}` : ''}</span>` : '').join('') || '<span class="empty">empty</span>';
const letters = counts => counts.map((n, c) => RULES.treasure[c].mark.repeat(n)).join('') || '–';
const bestColour = p => { const n = Math.max(...p.haul), t = RULES.treasure[p.haul.indexOf(n)]; return `${n} ${n === 1 ? t.one : t.name}`; };
const roundOpen = () => !V.last || V.last.round !== V.round;

// Before the game: every seat by name, a bot as "Player N 🤖 Greedy", or not yet joined.
const seatList = () => `<div class="row">${waiting.map((s, q) => `<div class="card ${q === seat ? 'you' : ''}">${s.name === null
  ? '<span class="muted">not yet joined</span>' : esc(s.name || `Player ${q + 1}`) + you(q)}${bot(s.bot)}</div>`).join('')}</div>`;

// The code, big enough to read across a table, and the full link to select.
const roomCode = () => `<p class="muted" style="text-align: center; margin: 8px 0 0">Room</p><p class="code">${esc(code)}</p>
  <p class="muted link">${esc(location.origin)}/?room=${esc(code)}</p>`;

// The host's lobby: a dropdown for every seat no connected person holds; every change sends seats at once.
const CHOICES = [['', 'Open for a person'], ...BOTS.personalities.map(p => [p.name, `🤖 ${p.name}`])];
const dropdown = (q, b) => `<select onchange="act.seat(${q}, this.value)">${CHOICES.map(([v, label]) =>
  `<option value="${v}" ${v === (b ?? '') ? 'selected' : ''}>${label}</option>`).join('')}</select>`;
const hostLobby = () => roomCode() + waiting.map((s, q) => `<div class="seat"><b>Seat ${q + 1}</b> ${q === 0 ? 'You (host)'
  : s.name !== null && !s.bot ? esc(s.name) : dropdown(q, s.bot) + (s.bot ? '' : ' <span class="muted">waiting…</span>')}</div>`).join('')
  + `<div class="row" style="justify-content: center; margin-top: 8px">
    <button onclick="act.resize(-1)" ${waiting.length <= RULES.minPlayers ? 'disabled' : ''}>−</button> ${waiting.length} seats
    <button onclick="act.resize(1)" ${waiting.length >= RULES.maxPlayers ? 'disabled' : ''}>+</button></div>
  <button class="big" onclick="act.start()">Start</button>`;

// ticks: a ✓ beside each seat that has picked this round.
function board(ticks) {
  return `<div class="row">${V.islands.map((pile, i) => `<div class="card">Island ${L(i)}<br>${tokens(pile)}</div>`).join('')}</div>
    <div class="row">${V.players.map((p, q) => `<div class="card ${q === seat ? 'you' : ''}">${name(q)}${you(q)}${bot(p.bot)}${ticks && p.picked ? ' ✓' : ''}<br>${tokens(p.haul)}</div>`).join('')}</div>
    <p class="muted">Round ${V.round} · first to ${RULES.winAt} of one colour wins</p>`;
}

function resultLine(r, i) {
  if (r.kind === 'raid') return `<p class="raid"><b>${L(i)}:</b> ${names(r.who)} raided it alone and took ${tokens(r.before)}! Now: ${tokens(r.after)}</p>`;
  if (r.kind === 'crash') return `<p class="crash"><b>${L(i)}:</b> CRASH! ${names(r.who)} collided. Nobody takes anything and ${L(i)} stays frozen.</p>`;
  return `<p class="empty"><b>${L(i)}:</b> Nobody came. Now: ${tokens(r.after)}</p>`;
}

const reveal = () => `<h2>Reveal!</h2>
  <p>${V.last.picks.map((isl, q) => `<b>${name(q)}</b> → ${isl === null ? 'no island' : L(isl)}`).join(' · ')}</p>
  ${V.last.results.map(resultLine).join('')}
  ${V.bagOut ? `<p class="crash"><b>The bag can't refill every island: the game ends!</b></p>` : ''}`;

const pickView = () => `<h2>Choose an island</h2>
  <div class="row">${V.islands.map((pile, i) => `<button class="card ${sel === i ? 'sel' : ''}" onclick="act.choose(${i})"><b>${L(i)}</b>${tokens(pile)}</button>`).join('')}</div>
  <button class="big" ${sel === null ? 'disabled' : ''} onclick="act.lock()">Lock in${sel === null ? '' : ` Island ${L(sel)}`}</button>`;

function end() {
  const all = V.history.flatMap(h => h.results);
  return `<h2>🏆 ${V.winners.map(q => `${name(q)} (${bestColour(V.players[q])})`).join(' & ')} ${V.winners.length > 1 ? 'share the win' : 'wins'}!</h2>
  ${V.bagOut ? `<p>The bag ran out, so the most of one colour won.</p>` : ''}
  <p>Rounds: <b>${V.history.length}</b> · Raids: <b>${all.filter(r => r.kind === 'raid').length}</b> ·
     Crashes: <b>${all.filter(r => r.kind === 'crash').length}</b> · Biggest island: <b>${V.maxIsland}</b> tokens</p>
  <div class="scroll"><table><tr><th>Round</th>${V.players.map((_, q) => `<th>${name(q)}</th>`).join('')}<th>Islands after</th></tr>
  ${V.history.map(h => `<tr><td>${h.round}</td>${h.picks.map(isl => {
    const r = h.results[isl];
    if (!r) return '<td>–</td>'; // skipped: no island
    return `<td class="${esc(r.kind)}">${L(isl)}${r.kind === 'raid' ? ` +${letters(r.before)}` : r.kind === 'crash' ? ' 💥' : ''}</td>`;
  }).join('')}<td>${h.results.map((r, i) => `${L(i)}:${letters(r.after)}`).join(' ')}</td></tr>`).join('')}</table></div>
  ${seat === 0 ? '<button class="big" onclick="act.again()">New game</button>' : `<p class="muted">Waiting for ${host()} to start a new game</p>`}`;
}

// The screen follows from the message (PIO2 03's table and PIO3 03's lobbies in the vault).
function screen() {
  if (seat === null && !joined) return waiting ? seatList() : board(); // Join: the form above, the room underneath
  if (V?.over) return board() + reveal() + end(); // Game over, for a seat or a spectator
  if (seat === null) return `<h2>Watching</h2><p class="muted">Every seat is taken.</p>${waiting ? seatList() : board() + (V.last ? reveal() : '')}`;
  if (waiting) return seat === 0 ? hostLobby() : roomCode() + `<p>Waiting for ${host()} to start</p>${seatList()}`;
  if (!roundOpen()) return board() + reveal() + '<button class="big" onclick="act.next()">Next round</button>';
  if (V.myPick === null) return board() + pickView();
  return board(true) + `<h2>You picked ${L(V.myPick)}</h2><p class="muted">✓ = picked. Waiting for the others…</p>`;
}

function render() {
  const setup = !code || noRoom; // a code that names no room gets the setup screen back, with its Join field
  $('setup').hidden = !setup; $('room').hidden = setup;
  if (noRoom) $('setup').elements.code.value = code.slice(0, 5);
  $('note').innerHTML = noRoom ? `<p class="crash"><b>There's no room ${esc(code)}. Check the code.</b></p>`
    : (lost ? '<p class="crash"><b>Lost the room. Reload to rejoin.</b></p>' : '') + (error ? `<p class="crash">${esc(error)}</p>` : '');
  if (setup) return;
  $('title').textContent = `Room ${code}`;
  $('room').disabled = lost;
  $('join').hidden = joined || seat !== null;
  if (seat !== undefined) $('app').innerHTML = screen();
}
render();
</script>
</body>
</html>
