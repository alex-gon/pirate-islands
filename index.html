<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pirate Islands</title>
<style>
  body { font: 17px/1.4 system-ui, sans-serif; max-width: 560px; margin: 0 auto; padding: 16px; background: #f4efe3; color: #222; }
  h1 { margin: 0 0 12px; } h2 { margin: 16px 0 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .card { flex: 1; min-width: 70px; background: #fff; border: 2px solid #c9b78f; border-radius: 10px; padding: 8px; text-align: center; }
  .card b { display: block; font-size: 26px; }
  .t { display: inline-block; min-width: 1.4em; margin: 2px; padding: 0 4px; border: 1px solid #0005; border-radius: 9px; font-weight: bold; font-size: 15px; }
  button { font: inherit; padding: 10px 16px; border: 0; border-radius: 8px; background: #1d5c7a; color: #fff; cursor: pointer; margin: 4px 0; }
  button.big { width: 100%; font-size: 20px; padding: 16px; }
  button.card { color: #222; } button.sel { border-color: #1d5c7a; background: #d7ecf5; }
  .cover { background: #1d3b4a; color: #fff; border-radius: 12px; padding: 32px 16px; text-align: center; }
  .raid { color: #1a7f37; } .crash { color: #b42318; } .empty { color: #777; }
  .muted { color: #666; font-size: 15px; }
  table { border-collapse: collapse; width: 100%; } td, th { border-bottom: 1px solid #ddd; padding: 4px; text-align: center; }
  input { font: inherit; padding: 8px; width: 100%; box-sizing: border-box; margin: 3px 0; }
</style>
</head>
<body>
<div id="app"></div>
<script src="rules.js"></script>
<script src="howtoplay.js"></script>
<script>
// The rules and bots live in rules.js; this page is the hotseat: one screen, passed between the human seats.
const { RULES, BOTS } = Rules;
const LETTERS = 'ABCDE';
const esc = s => s.replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`); // names are typed by players, so escape before HTML
const zeros = () => RULES.treasure.map(() => 0);

let S = null; // the game in play, a Rules state; null = setup screen
let phase, turn, sel; // the screen showing, whose turn it is, the island they've chosen but not locked in
let setup = { count: 3, names: ['Alex', 'Jamie', 'Morgan', 'Player 4', 'Player 5'], bots: [null, null, null, null, null], rot: 0 };

// The bots have already picked; show the next human seat, or resolve once every seat has picked. Pass screens only with 2+ humans.
function advance() {
  if (Rules.allPicked(S)) { Rules.resolve(S); phase = 'reveal'; }
  else { turn = S.picks.indexOf(null); phase = S.players.filter(p => !p.bot).length > 1 ? 'pass' : 'pick'; }
  sel = null;
}

// ---- Actions (called from buttons) ----
const act = {
  count(n) { setup.count = n; render(); },
  name(i, v) { setup.names[i] = v; },
  bot(i) { setup.bots[i] = setup.bots[i] === null ? BOTS.personalities[setup.rot++ % BOTS.personalities.length].name : null; render(); },
  start() { S = Rules.newGame(setup.names.slice(0, setup.count).map(n => n.trim()), setup.bots, Date.now()); advance(); render(); },
  show() { phase = 'pick'; sel = null; render(); },
  choose(i) { sel = i; render(); },
  lock() { Rules.pick(S, turn, sel); advance(); render(); },
  next() {
    if (S.winners) phase = 'end';
    else { Rules.nextRound(S); advance(); }
    render();
  },
  again() { S = null; render(); },
};

// ---- Views ----
const L = i => LETTERS[i];
const name = q => esc(S.players[q].name); // names are stored as typed and escaped here, where they're drawn
const names = who => who.map(name).join(' & ');
const tokens = counts => counts.map((n, c) => n ? `<span class="t" style="background:${RULES.treasure[c].ink}">${RULES.treasure[c].mark}${n > 1 ? `×${n}` : ''}</span>` : '').join('') || '<span class="empty">empty</span>';
const letters = counts => counts.map((n, c) => RULES.treasure[c].mark.repeat(n)).join('') || '–';
const bestColour = p => { const n = Math.max(...p.haul), t = RULES.treasure[p.haul.indexOf(n)]; return `${n} ${n === 1 ? t.one : t.name}`; };

function board() {
  return `<div class="row">${S.islands.map((pile, i) => `<div class="card">Island ${L(i)}<br>${tokens(pile)}</div>`).join('')}</div>
    <div class="row">${S.players.map((p, q) => `<div class="card">${name(q)}${p.bot ? ` <span class="muted">🤖 ${p.bot}</span>` : ''}<br>${tokens(p.haul)}</div>`).join('')}</div>
    <p class="muted">Round ${S.round} · first to ${RULES.winAt} of one colour wins</p>`;
}

function resultLine(r, i) {
  if (r.kind === 'raid') return `<p class="raid"><b>${L(i)}:</b> ${names(r.who)} raided it alone and took ${tokens(r.before)}! Now: ${tokens(r.after)}</p>`;
  if (r.kind === 'crash') return `<p class="crash"><b>${L(i)}:</b> CRASH! ${names(r.who)} collided. Nobody takes anything and ${L(i)} stays frozen.</p>`;
  return `<p class="empty"><b>${L(i)}:</b> Nobody came. Now: ${tokens(r.after)}</p>`;
}

// Last round, under the pick screen's Lock in: one line per player, as its reveal said (PIO4 10). No skips here.
const lastRound = () => S.round === 1 ? '' : `<p class="muted">Last round</p>${S.history.at(-1).picks.map((isl, q) => {
  const r = S.history.at(-1).results[isl], line = `${name(q)} → ${L(isl)}: ${r.kind === 'raid' ? `raided alone, took ${tokens(r.before)}`
    : `💥 crash with ${names(r.who.filter(w => w !== q))}`}`;
  return `<p>${q === turn ? `<b>${line}</b>` : line}</p>`;
}).join('')}`;

const views = {
  pass: () => `<div class="cover"><p>Round ${S.round}: pass the device to</p><h2>${name(turn)}</h2>
    <p>Everyone else, look away!</p><button class="big" onclick="act.show()">I'm ${name(turn)}, show islands</button></div>`,
  pick: () => `<h2>${name(turn)}, choose an island</h2>
    <div class="row">${S.islands.map((pile, i) => `<button class="card ${sel === i ? 'sel' : ''}" onclick="act.choose(${i})"><b>${L(i)}</b>${tokens(pile)}</button>`).join('')}</div>
    <button class="big" ${sel === null ? 'disabled' : ''} onclick="act.lock()">Lock in${sel === null ? '' : ` Island ${L(sel)}`}</button>
    ${lastRound()}`,
  reveal: () => `<h2>Reveal!</h2>
    <p>${S.history.at(-1).picks.map((isl, q) => `<b>${name(q)}</b> → ${isl === null ? 'no island' : L(isl)}`).join(' · ')}</p>
    ${S.history.at(-1).results.map(resultLine).join('')}
    ${S.bagOut ? `<p class="crash"><b>The bag can't refill every island: the game ends!</b></p>` : ''}
    <button class="big" onclick="act.next()">${S.winners ? 'See who won' : 'Next round'}</button>`,
  end: () => {
    const all = S.history.flatMap(h => h.results);
    return `<h2>🏆 ${S.winners.map(q => `${name(q)} (${bestColour(S.players[q])})`).join(' & ')} ${S.winners.length > 1 ? 'share the win' : 'wins'}!</h2>
    ${S.bagOut ? `<p>The bag ran out, so the most of one colour won.</p>` : ''}
    <p>Rounds: <b>${S.history.length}</b> · Raids: <b>${all.filter(r => r.kind === 'raid').length}</b> ·
       Crashes: <b>${all.filter(r => r.kind === 'crash').length}</b> · Biggest island: <b>${S.maxIsland}</b> tokens</p>
    <table><tr><th>Round</th>${S.players.map((_, q) => `<th>${name(q)}</th>`).join('')}<th>Islands after</th></tr>
    ${S.history.map(h => `<tr><td>${h.round}</td>${h.picks.map(isl => {
      const r = h.results[isl];
      if (!r) return '<td>–</td>'; // skipped: no island
      return `<td class="${r.kind}">${L(isl)}${r.kind === 'raid' ? ` +${letters(r.before)}` : r.kind === 'crash' ? ' 💥' : ''}</td>`;
    }).join('')}<td>${h.results.map((r, i) => `${L(i)}:${letters(r.after)}`).join(' ')}</td></tr>`).join('')}</table>
    <button class="big" onclick="act.again()">New game</button>`;
  },
};

function setupView() {
  return `<h1>🏴‍☠️ Pirate Islands</h1><p>Secretly pick an island. Alone? Take its whole pile.
    Anyone else there? Crash: nobody takes anything and the island freezes. Every other island gets ${RULES.refill} new treasure
    from the bag. First to ${RULES.winAt} of one colour wins.</p>
    <p>${RULES.treasure.map((t, c) => `${tokens(zeros().map((_, k) => +(k === c)))} ${t.name}`).join(' · ')}</p>
    <h2>Players</h2><div class="row">${[...Array(RULES.maxPlayers - RULES.minPlayers + 1)].map((_, k) => {
      const n = RULES.minPlayers + k;
      return `<button class="card ${setup.count === n ? 'sel' : ''}" onclick="act.count(${n})">${n}</button>`;
    }).join('')}</div>
    ${setup.names.slice(0, setup.count).map((n, i) => `<div class="row"><input style="flex: 1; width: auto" value="${esc(n)}" oninput="act.name(${i}, this.value)">
      <button onclick="act.bot(${i})">${setup.bots[i] === null ? '🙂 Human' : `🤖 ${setup.bots[i]}`}</button></div>`).join('')}
    <button class="big" onclick="act.start()">Set sail</button>`;
}

function render() {
  document.getElementById('app').innerHTML = S ? `<h1>🏴‍☠️ Pirate Islands</h1>${board()}${views[phase]()}` : setupView();
}
HowToPlay.mount(false, true); // the ? and the How to play card, nothing else
render();
</script>
</body>
</html>
